name: MetaStackr
services:
  - name: postgres
    cwd: .
    command: sh
    args: ["-c", "docker start metastackr-postgres 2>/dev/null || docker run -d --name metastackr-postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_USER=postgres -e POSTGRES_DB=metastackr -p 5432:5432 postgres:16"]
    oneShot: true
    liveness:
      type: command
      command: docker exec metastackr-postgres pg_isready -U postgres

  - name: build
    cwd: .
    command: sh
    args:
      - "-c"
      - "go build -o metastackrd ./cmd/metastackrd && go build -o git-meta ./cmd/git-meta && ln -sf $(pwd)/git-meta /usr/local/bin/git-meta"
    oneShot: true
    dependsOn:
      - postgres

  - name: api-server
    cwd: .
    command: ./metastackrd
    env:
      DATABASE_URL: "postgres://postgres:postgres@localhost:5432/metastackr?sslmode=disable"
      PORT: "8080"
    dependsOn:
      - build
    liveness:
      type: http
      url: "http://localhost:8080/healthz"
    note: "http://localhost:8080"

  - name: website
    cwd: .
    command: python3
    args: ["-m", "http.server", "8081", "--directory", "web"]
    liveness:
      type: http
      url: "http://localhost:8081"
    note: "http://localhost:8081"
